services:
  postgres:
    image: postgres:17-alpine
    container_name: business_twin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_twin_db}
      POSTGRES_USER: ${POSTGRES_USER:-twin_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSuperSecureDbPassword123!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twin_admin} -d ${POSTGRES_DB:-business_twin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: business_twin_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-YourSuperSecureRedisPassword123!}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YourSuperSecureRedisPassword123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: business_twin_ai_service
    restart: unless-stopped
    environment:
      AI_SERVICE_API_KEY: ${AiService__ApiKey:-internal-secret-service-token-12345}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: business_twin_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-business_twin_db};Username=${POSTGRES_USER:-twin_admin};Password=${POSTGRES_PASSWORD:-YourSuperSecureDbPassword123!}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-YourSuperSecureRedisPassword123!},abortConnect=false"
      Jwt__Secret: ${Jwt__Secret:-SuperSecretKeyForBusinessDigitalTwinMustBeAtLeast32CharsLong!}
      Jwt__Issuer: ${Jwt__Issuer:-BusinessDigitalTwin}
      Jwt__Audience: ${Jwt__Audience:-BusinessDigitalTwinClient}
      AiService__BaseUrl: "http://ai-service:8000"
      AiService__ApiKey: ${AiService__ApiKey:-internal-secret-service-token-12345}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: business_twin_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_APP_NAME: "Business Digital Twin"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
